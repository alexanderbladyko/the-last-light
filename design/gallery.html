<!doctype html><html><head><meta charset="utf-8"><title>Asset construction study</title><script type="importmap">{"imports":{"three":"../game/vendor/three.module.js"}}</script><style>body{margin:25px;background:#e6dcc5;color:#292d30;font:14px system-ui}h1{font:28px Georgia}h2{font:20px Georgia;margin:25px 0 12px}.row{display:flex;gap:15px}.candidate{width:31%;border:1px solid #bcb09c;padding:10px}img{display:block;width:50%;float:left}small{font-size:11px}button{padding:10px;margin-right:10px}#status{margin:15px}</style></head><body><h1>Three construction readings · four views each</h1><div id="nav"></div><p id="status">Rendering…</p><div class="row" id="row"></div><script type="module">
import * as THREE from 'three';
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(680,480);r.setPixelRatio(1);r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.3;
const names=['doll','top','music','lantern','stage','ghost'];
for(const name of names){const b=document.createElement('button');b.textContent=name;b.onclick=()=>render(name);document.querySelector('#nav').append(b);}
async function render(name){document.querySelector('#row').replaceChildren();document.querySelector('#status').textContent=name+' · primitive / profile or panels / alternate assembly';for(let v=1;v<=3;v++){const {default:gen}=await import('./candidates/'+name+'-'+v+'.js');const obj=gen(THREE),scene=new THREE.Scene();scene.background=new THREE.Color('#ddd3ba');scene.add(obj,new THREE.HemisphereLight('#ffffff','#6a5140',2.6));const light=new THREE.DirectionalLight('#ffe4b6',3);light.position.set(4,8,7);scene.add(light);const bounds=new THREE.Box3().setFromObject(obj),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3()),d=Math.max(size.x,size.y,size.z)*1.15;const c=new THREE.PerspectiveCamera(38,680/480,.01,200);const card=document.createElement('div');card.className='candidate';const h=document.createElement('h2');h.textContent='Candidate '+v;card.append(h);for(const a of [0,Math.PI/2,Math.PI,Math.PI*1.5]){c.position.set(center.x+Math.sin(a+.35)*d*1.6,center.y+d*.65,center.z+Math.cos(a+.35)*d*1.6);c.lookAt(center);r.render(scene,c);const img=document.createElement('img');img.src=r.domElement.toDataURL();img.alt=name+' candidate '+v+' view '+a;card.append(img);}document.querySelector('#row').append(card);}document.querySelector('#status').textContent=name+' · rendered all 12 views';}
render('doll');
</script></body></html>
